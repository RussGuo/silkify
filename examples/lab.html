<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silkify Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%238a6d3b%22/%3E%3C/svg%3E">
<meta name="description" content="Every silkify option on one page: drag, see it live, copy the options.">
<!-- link previews (Open Graph, X / Twitter): docs/og.jpg is the README's hero, cropped to 1200 × 630 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="silkify">
<meta property="og:title" content="silkify Lab">
<meta property="og:description" content="Every silkify option on one page: drag it, see it live, copy the options, record a clip.">
<meta property="og:url" content="https://russguo.github.io/silkify/examples/lab.html">
<meta property="og:image" content="https://russguo.github.io/silkify/docs/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js" } }
</script>
</head>
<body>
<main class="lab">
  <section class="stage" id="stage">
    <div class="top">
      <div class="brand"><h1><a href="./">silk<em>ify</em></a> Lab</h1><button id="install" type="button" title="Copies one sentence: paste it into Claude Code, Codex, Cursor, Copilot or any agent that loads skills, and it installs silkify" data-install="Install the silkify agent skill: git clone --depth 1 --branch v0.3.0 https://github.com/RussGuo/silkify into a folder named silkify in the directory you load skills from (~/.claude/skills for Claude Code; ~/.agents/skills for Codex, Cursor, GitHub Copilot, Gemini CLI and most other agents), then read its SKILL.md and tell me whether silkify is ready.">Install in your agent</button></div>
      <div class="read" id="read" aria-live="polite">loading…</div>
    </div>
    <span class="badge" id="badge">defaults</span>
    <p class="still" id="still" hidden>Your system asks for reduced motion, so silkify draws one still frame, as it will on your
      own pages. <button id="play">Play anyway in the Lab</button></p>
    <div class="foot">
      <span class="drop-hint">drop or paste an image or a URL · hold to press deeper · hold B to compare</span>
      <div class="acts">
        <button id="record" title="a 3 or 5 s clip of this object, square or 9:16, saved as a video" hidden>Record</button>
        <button id="touch" title="handle.ripple() in the middle of the object">Touch</button>
        <button id="stroke" title="a line of handle.ripple() drops across the object">Stroke</button>
        <button id="compare" title="hold (or hold the B key): the same object with silkify's defaults">Hold to compare</button>
      </div>
    </div>
  </section>
  <aside>
    <div class="controls" id="controls"></div>
    <div class="out">
      <pre><code id="code"></code></pre>
      <div class="bar">
        <button id="copy">Copy options</button><button id="link">Copy link</button><button id="download" title="this object and these options as one HTML file that opens with a double-click. The file loads silk.js and three.js from jsDelivr, so it depends on that CDN; for a page you publish, copy src/ into your project as SKILL.md says">Download HTML</button><button id="reset">Reset</button>
        <a href="how-it-works.html" style="margin-left:auto;align-self:center;color:var(--fine)">How it works</a>
        <a href="./" style="align-self:center;color:var(--fine)">← Gallery</a>
      </div>
      <p class="credit"><span id="byline"><!-- byline -->Made by <a href="https://github.com/RussGuo">Russ Guo</a><!-- /byline --></span> · <a href="https://github.com/RussGuo/silkify">silkify on GitHub</a></p>
    </div>
  </aside>
</main>

<script type="module">
  /*
   * lab.html — every silkify option on one page, so tuning is something you see rather than guess.
   * Live options go through handle.setTheme(); options that shape the scene (picture, shape, puff, fit, tier…)
   * remount it. The page runs exactly the call it prints, and the whole state lives in the URL hash, so a link
   * reproduces a look. resolveOptions() (silk.js) and the preset tables (presets.js) are the same ones silkify
   * uses; scripts/shoot.mjs drives this page through window.__lab (verify, and --lab for docs/shots/lab/).
   * Download HTML writes the same call into a page of its own, with the picture inside it (and silk.js from the CDN). When the system asks for
   * reduced motion, the stage says so and offers to play anyway, for this page only.
   * The panel opens on the look (object, material, feel); every other option is under Advanced, each with a plain
   * name and one line from references/parameters.md (lab-help.js). lab.html?debug shows the renderer's readout.
   * Object → Words sets text instead of a picture (lab-text.js: the fonts, and a Google Font's stylesheet once picked).
   * Record films the stage as a short clip (lab-record.js); Download HTML's page is lab-export.js.
   * The page's look is lab.css.
   */
  import { silkify, resolveOptions, PUFF } from '../src/silk.js';
  import { MATERIALS, FEELS, keysOf } from '../src/presets.js';
  import { HELP } from './lab-help.js';              // one line per option, from references/parameters.md
  import { pageHtml } from './lab-export.js';         // Download HTML: the page around the printed call
  import { recorder } from './lab-record.js';         // Record: a clip of the stage, square or 9:16
  import { TEXT_START, TEXT_KEYS, LINE_HEIGHT, wordRows, stylesheetOf, useStylesheet, onInk } from './lab-text.js';
  import { GROUPS, BACKGROUNDS, cleanState, safeUrl, js } from './lab-state.js';   // what a link may set; values as code

  /* ============================================
   * The objects: the gallery's cards (same pictures, same options)
   * ============================================ */
  const OBJECTS = {
    pomegranate: { title: 'Pomegranate', image: 'images/pomegranate.webp', options: { puff: 'dome' } },
    'mona-lisa': { title: 'Mona Lisa', image: 'images/mona-lisa.webp', options: { puff: 'cushion', floor: 0.6, sheen: 0.25 } },
    moon: { title: 'The Moon', image: 'images/moon.webp', bump: 'images/moon-bump.webp',
      options: { shape: 'sphere', phase: 0.38, floor: 0.6, exposure: 1.1, gamma: 0.92, bumpStrength: 7 } },
    hare: { title: 'Young Hare', image: 'images/hare.webp', options: { puff: 'cushion' } },
    teapot: { title: 'Teapot', image: 'images/teapot.webp', options: { puff: 'cushion', sheen: 0.5, sheenPower: 14 } },
    carriera: { title: 'Portrait of a Man', image: 'images/carriera.webp', options: { puff: 'flat', floor: 0.6 } },
    parrot: { title: 'Bird figure', image: 'images/parrot.webp', options: { puff: 'cushion', sheen: 0.5, sheenPower: 14 } },
    'ink-drop': { title: 'A drop of ink', image: 'images/ink-drop.webp',
      options: { albedo: [0.15, 0.15, 0.165], grain: 1, light: [-0.66, 0.72, 0.2], exposure: 2.2, floor: 0.42, volume: 0.3, sheen: 0.5, sheenPower: 14 } },
    text: { title: 'Words', options: TEXT_START },        // no picture: silkify sets the words in a canvas (lab-text.js)
  };

  /* ============================================
   * Every option is in lab-state.js's GROUPS, with its control and range: [key, kind, ...]. Keys in REBUILD need a
   * new renderer (debounced); every other key goes through setTheme() live.
   * ============================================ */
  const IMAGE_ONLY = new Set(['puff', 'matte', 'corner', 'threshold', 'fit', 'albedo', 'grain', 'grainScale']);
  const SPHERE_ONLY = new Set(['phase', 'bumpStrength', 'spin', 'spinSpeed', 'angle']);
  const REBUILD = new Set(['shape', 'puff', 'matte', 'corner', 'threshold', 'fit', 'angle', 'tier', 'worker', ...TEXT_KEYS]);
  const MATERIAL_KEYS = keysOf(MATERIALS), FEEL_KEYS = keysOf(FEELS);

  /* ============================================
   * State: which object, which presets, and the options set on top (the card's own, then yours).
   * The page runs exactly the call it prints: silkify(canvas, { image, material, feel, ...set }).
   * ============================================ */
  const qs = new URLSearchParams(location.search);
  const fresh = (obj = 'pomegranate') => ({ obj, url: null, material: 'silk', feel: 'silk', bg: 'stage',
    set: { ...structuredClone(OBJECTS[obj]?.options || {}), ...(['auto', 'high', 'low', 'static'].includes(qs.get('tier')) ? { tier: qs.get('tier') } : {}) } });
  let state = readHash() || fresh();
  let custom = null;                       // a dropped or pasted picture (a File or Blob); never uploaded, never in the link

  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const call = () => ({ material: state.material, feel: state.feel, ...state.set });
  const isText = () => state.obj === 'text';
  const picture = () => (state.obj === 'custom' ? (custom || state.url) : OBJECTS[state.obj].image);
  const effective = () => resolveOptions({ ...(isText() ? {} : { image: picture() || OBJECTS.pomegranate.image }), ...call() });
  const isSphere = () => effective().shape === 'sphere';
  const isLocal = () => state.obj === 'custom' && !state.url;

  /* ---- the hash: JSON → base64url, so a link restores every control ---- */
  function writeHash() {
    const s = { ...state, obj: state.obj === 'custom' && !state.url ? 'pomegranate' : state.obj };
    const b = btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    history.replaceState(null, '', `${location.pathname}${location.search}#${b}`);
  }
  /** The link's state, kept to what the controls could have set (lab-state.js): a link is anyone's to make. */
  function readHash() {
    try {
      const b = location.hash.slice(1);
      return b ? cleanState(JSON.parse(decodeURIComponent(escape(atob(b.replace(/-/g, '+').replace(/_/g, '/'))))), OBJECTS) : null;
    } catch { return null; }
  }

  /* ============================================
   * Mounting: live keys go through setTheme; a rebuild key remounts after 150 ms of quiet
   * ============================================ */
  const stage = document.getElementById('stage');
  let handle = null, mounted = null, remountTimer = 0, lastFrames = null, playAnyway = false;
  const reduceMq = matchMedia('(prefers-reduced-motion: reduce)');
  const stillNote = document.getElementById('still');
  document.getElementById('play').onclick = () => { playAnyway = true; mount(); };
  reduceMq.addEventListener?.('change', () => mount());

  /* Words in a Google Font wait for its stylesheet (lab-text.js); everything else mounts at once. A newer mount wins. */
  let mounting = Promise.resolve(), mounts = 0;
  function mount() {
    const n = ++mounts, sheet = isText() ? stylesheetOf(state.set.font) : null;
    mounting = sheet ? useStylesheet(sheet).then(() => n === mounts && mountNow()) : Promise.resolve(mountNow());
    return mounting;
  }
  function mountNow() {
    comparing = false;
    stage.classList.remove('compare');
    rec.stop();                                         // a recording ends with the renderer it records
    handle?.dispose();
    handle?.canvas.remove();
    const canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    stage.prepend(canvas);
    const o = OBJECTS[state.obj];
    mounted = effective();
    // reduced motion: the Lab is a tuning page, so it may play anyway when asked (never printed, never in the link)
    try {
      handle = silkify(canvas, { ...(isText() ? {} : { image: picture() }), ...(o?.bump ? { bump: o.bump } : {}), ...call(), ...(playAnyway ? { reducedMotion: false } : {}) });
    } catch (e) {                                       // a link with a font or colour the browser cannot read
      handle = null;
      read.textContent = e.message;
      return null;
    }
    rec.reframe();                                      // Record: the new canvas takes the clip's shape too
    handle.ready.then(() => rec.reframe());
    stillNote.hidden = !(reduceMq.matches && !playAnyway && (state.set.reducedMotion ?? 'auto') === 'auto');
    lastFrames = null;
    return handle.ready;
  }
  /** Apply the state: setTheme the live keys that changed; remount if a rebuild key changed. */
  function commit({ remount = false } = {}) {
    const next = effective();
    const changed = Object.keys(next).filter((k) => !same(next[k], mounted?.[k]));
    if (remount || changed.some((k) => REBUILD.has(k))) {
      clearTimeout(remountTimer);
      remountTimer = setTimeout(mount, 150);
    } else if (changed.length && handle) {
      const patch = Object.fromEntries(changed.map((k) => [k, next[k]]));
      handle.setTheme(patch);
      Object.assign(mounted, patch);
    }
    sync();
    writeHash();
  }

  /* ============================================
   * Controls
   * ============================================ */
  const root = document.getElementById('controls');
  const views = [];                                   // { key, row, show(value) } — refreshed by sync()
  const hex = (c) => '#' + c.map((x) => Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16).padStart(2, '0')).join('');
  const rgb = (h) => [1, 3, 5].map((i) => Math.round((parseInt(h.slice(i, i + 2), 16) / 255) * 1000) / 1000);
  const round = (v, step) => +(Math.round(v / step) * step).toFixed(Math.max(0, -Math.floor(Math.log10(step))));
  const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
  const set = (key, value) => { state.set[key] = value; commit(); };

  /* Every row: a person's name for the option, its API name in monospace, and one line from references/parameters.md
   * (HELP, generated into lab-help.js) under it, visible on touch too. The label names the row's main control (for/id)
   * and the line describes it (aria-describedby); every other input in the row has an aria-label. */
  const LABELS = {
    object: 'Object', URL: 'Your picture', background: 'Background', material: 'Material', feel: 'Feel',
    pressDepth: 'Press depth', pressDepthHold: 'Press depth, held', pressRadius: 'Press radius', waveSpeed: 'Wave speed',
    damping: 'Damping', displace: 'Displacement', ripple: 'Ripple contrast', sheen: 'Sheen', sheenPower: 'Sheen sharpness',
    sheenColor: 'Sheen colour', satin: 'Satin', albedo: 'Flat colour', grain: 'Grain', grainScale: 'Grain size', gamma: 'Gamma',
    exposure: 'Exposure', metallic: 'Metallic', anisotropy: 'Anisotropy', anisotropyAngle: 'Thread angle', threads: 'Threads',
    rim: 'Rim light', rimPower: 'Rim falloff', rimColor: 'Rim colour', iridescence: 'Iridescence', silkRest: 'Silk at rest',
    silkSpread: 'Silk spread', light: 'Key light', lightColor: 'Light colour', satinLight: 'Satin light', floor: 'Shadow floor',
    volume: 'Volume', fillLight: 'Fill light', idleSweep: 'Idle sweep', autoplay: 'Autoplay', breeze: 'Breeze', shape: 'Shape',
    puff: 'Puff', matte: 'Matte', corner: 'Corner', threshold: 'Threshold', fit: 'Fit', phase: 'Moon phase',
    bumpStrength: 'Relief', spin: 'Spin', spinSpeed: 'Spin speed', angle: 'Start angle', interactive: 'Interactive',
    tier: 'Tier', worker: 'Worker', text: 'Words', font: 'Font', color: 'Colour', lineHeight: 'Line height',
  };
  const API = new Set(Object.keys(LABELS).filter((k) => !['object', 'URL', 'background'].includes(k)));
  const rich = (t) => t.split('`').map((s, i) => (i % 2 ? el('code', { textContent: s }) : document.createTextNode(s)));
  function row(key) {
    const id = `opt-${key}`;
    const r = el('div', { className: 'row' }, el('label', { htmlFor: id }, LABELS[key] || key, ...(API.has(key) ? [el('code', { textContent: key })] : [])));
    r.dataset.key = key;
    if (HELP[key]) r.append(el('p', { className: 'help', id: `${id}-help` }, ...rich(HELP[key])));
    const box = el('div', { className: 'ctl' });
    r.append(box);
    /** The row's main control: the one its label names and its line describes. */
    const main = (n) => { n.id = id; if (HELP[key]) n.setAttribute('aria-describedby', `${id}-help`); return n; };
    return [r, box, main];
  }
  const named = (n, name) => { n.setAttribute('aria-label', name); return n; };

  function number(key, min, max, step, nullable) {
    const [r, box, main] = row(key);
    const range = main(el('input', { type: 'range', min, max, step }));
    const num = named(el('input', { type: 'number', min, max, step }), `${key} value`);
    const on = nullable ? named(el('input', { type: 'checkbox', title: `${key}: null when off` }), `${LABELS[key]}: on`) : null;
    const put = (v) => { if (v !== '' && Number.isFinite(+v)) set(key, round(Math.min(max, Math.max(min, +v)), step)); else sync(); };
    range.oninput = () => put(range.value);
    num.onchange = () => put(num.value);
    if (on) { on.onchange = () => set(key, on.checked ? round((min + max) / 2, step) : null); box.append(on); }
    box.append(range, num);
    return { key, row: r, show(v) {
      if (on) on.checked = v !== null && v !== undefined;
      range.disabled = num.disabled = !!on && !on.checked;
      if (v !== null && v !== undefined) { range.value = v; num.value = v; }
    } };
  }
  function color(key, nullable) {
    const [r, box, main] = row(key);
    const pick = main(el('input', { type: 'color' }));
    const on = nullable ? named(el('input', { type: 'checkbox', title: `${key}: off = null, the picture's own colour` }), `${LABELS[key]}: on`) : null;
    pick.oninput = () => set(key, rgb(pick.value));
    if (on) { on.onchange = () => set(key, on.checked ? rgb(pick.value) : null); box.append(on); }
    const txt = el('span', { className: 'note' });
    box.append(pick, txt);
    return { key, row: r, show(v) {
      if (on) on.checked = !!v;
      pick.disabled = !!on && !v;
      if (v) pick.value = hex(v);
      txt.textContent = v ? `[${v.join(', ')}]` : 'null';
    } };
  }
  function direction(key) {
    const [r, box, main] = row(key);
    const disc = el('div', { className: 'disc', title: 'drag: x right, y up' }), dot = el('i');
    disc.append(dot);
    const z = main(el('input', { type: 'range', min: 0.05, max: 1.5, step: 0.01 }));
    const out = el('span');
    box.append(disc, el('div', { className: 'z' }, el('span', { textContent: 'z (towards you), drag the disc for x and y' }), z, out));
    let cur = [0, 0, 1];
    const drag = (e) => {
      const b = disc.getBoundingClientRect();
      const x = Math.max(-1, Math.min(1, ((e.clientX - b.left) / b.width) * 2 - 1));
      const y = Math.max(-1, Math.min(1, -(((e.clientY - b.top) / b.height) * 2 - 1)));
      set(key, [round(x, 0.01), round(y, 0.01), cur[2]]);
    };
    disc.onpointerdown = (e) => { disc.setPointerCapture(e.pointerId); drag(e); disc.onpointermove = drag; };
    disc.onpointerup = disc.onpointercancel = () => { disc.onpointermove = null; };
    z.oninput = () => set(key, [cur[0], cur[1], +z.value]);
    return { key, row: r, show(v) {
      cur = v;
      dot.style.left = `${50 + 50 * Math.max(-1, Math.min(1, v[0]))}%`;
      dot.style.top = `${50 - 50 * Math.max(-1, Math.min(1, v[1]))}%`;
      z.value = v[2];
      out.textContent = `[${v.join(', ')}]`;
    } };
  }
  function toggle(key) {
    const [r, box, main] = row(key);
    const on = main(el('input', { type: 'checkbox' }));
    on.onchange = () => set(key, on.checked);
    box.append(on);
    return { key, row: r, show(v) { on.checked = !!v; } };
  }
  function choice(key, options) {
    const [r, box, main] = row(key);
    const s = main(el('select'));
    for (const v of options) s.append(el('option', { value: String(v), textContent: String(v) }));
    s.onchange = () => set(key, options.find((v) => String(v) === s.value));
    box.append(s);
    return { key, row: r, show(v) { s.value = String(v); } };
  }
  function puff() {
    const [r, box, main] = row('puff');
    const s = main(el('select'));
    for (const v of [...Object.keys(PUFF), 'number']) s.append(el('option', { value: v, textContent: v }));
    const range = named(el('input', { type: 'range', min: 0.1, max: 1.5, step: 0.01 }), 'puff as a number');
    s.onchange = () => set('puff', s.value === 'number' ? +range.value : s.value);
    range.oninput = () => set('puff', +range.value);
    box.append(s, range);
    return { key: 'puff', row: r, show(v) { s.value = typeof v === 'string' ? v : 'number'; range.value = typeof v === 'string' ? PUFF[v] : v; } };
  }
  function autoplay() {
    const [r, box, main] = row('autoplay');
    const on = main(el('input', { type: 'checkbox' }));
    const every = named(el('input', { type: 'range', min: 600, max: 8000, step: 100, title: 'interval (ms)' }), 'autoplay interval (ms)');
    const depth = named(el('input', { type: 'range', min: 0.05, max: 0.8, step: 0.01, title: 'depth' }), 'autoplay depth');
    const val = () => (on.checked ? { interval: +every.value, depth: +depth.value } : false);
    on.onchange = every.oninput = depth.oninput = () => set('autoplay', val());
    const drop = el('button', { textContent: 'ripple()', title: 'handle.ripple() at a random point' });
    drop.onclick = () => handle?.ripple(0.3 + 0.4 * Math.random(), 0.3 + 0.4 * Math.random());
    box.append(on, every, depth, drop);
    return { key: 'autoplay', row: r, show(v) {
      on.checked = !!v;
      every.value = v?.interval ?? 2500; depth.value = v?.depth ?? 0.3;
      every.disabled = depth.disabled = !v;
    } };
  }
  function presets() {
    const box = el('div');
    const pick = (label, group, field, keys) => {
      const [r, w, main] = row(label);
      const s = main(el('select'));
      for (const k of Object.keys(group)) s.append(el('option', { value: k, textContent: k }));
      s.onchange = () => {
        for (const k of keys) delete state.set[k];          // the preset's values show; edit after to override
        state[field] = s.value;
        commit();
      };
      w.append(s);
      box.append(r);
      return { key: field, row: r, show: () => { s.value = state[field]; } };
    };
    views.push(pick('material', MATERIALS, 'material', MATERIAL_KEYS), pick('feel', FEELS, 'feel', FEEL_KEYS));
    return box;
  }
  function object() {
    const box = el('div');
    const [r1, w1, main1] = row('object');
    const s = main1(el('select'));
    for (const [k, o] of Object.entries(OBJECTS)) s.append(el('option', { value: k, textContent: o.title }));
    s.append(el('option', { value: 'custom', textContent: 'Your picture…', disabled: true }));
    s.onchange = () => { custom = null; state = { ...fresh(s.value), material: state.material, feel: state.feel, bg: state.bg }; commit({ remount: true }); };
    w1.append(s);
    const [r2, w2, main2] = row('URL');
    const url = main2(el('input', { type: 'text', placeholder: 'https://… (CORS)' }));
    url.onchange = () => { if (!url.value.trim()) return; if (safeUrl(url.value)) useUrl(url.value.trim()); else { url.value = ''; url.placeholder = 'an http(s) address of a picture'; } };
    const file = el('input', { type: 'file', accept: 'image/*', hidden: true });
    file.onchange = () => file.files[0] && useBlob(file.files[0]);
    w2.append(url, el('button', { textContent: 'File', onclick: () => file.click() }), file);
    const [r3, w3, main3] = row('background');
    const bg = main3(el('select'));
    for (const v of BACKGROUNDS) bg.append(el('option', { value: v, textContent: v }));
    bg.onchange = () => { state.bg = bg.value; sync(); writeHash(); };
    w3.append(bg);
    const local = el('p', { className: 'note', textContent: 'A local picture is never uploaded, so it is not in the link: the link opens the pomegranate with these settings.' });
    const mark = el('p', { className: 'note', textContent: 'The ink drop is the FateTell mark, © FateTell: try things with it here, but put your own picture in a page you publish.' });
    box.append(r2, r3, local, mark);
    views.push({ key: 'object', row: r1, show() {
      s.value = state.obj; url.value = state.url || ''; bg.value = state.bg; stage.dataset.bg = state.bg;
      local.hidden = !isLocal();
      mark.hidden = state.obj !== 'ink-drop';
    } });
    return [r1, box];
  }

  /* Words (Object → Words): their rows are lab-text.js's, made with this page's row helpers */
  const words = () => wordRows({ row, named, number, set, views, el });

  /* The look first: object, material, feel (then your own picture and the background), always open. Every other option
   * is under Advanced, closed unless the link already carries a value beyond the object's own options. Room is left
   * on purpose: a text object joins the object list (#13), a Record button the stage's button row (#15). */
  const tuned = () => { const base = fresh(state.obj).set; return Object.keys({ ...base, ...state.set }).some((k) => !TEXT_KEYS.includes(k) && !same(state.set[k], base[k])); };
  function build() {
    const [pick, more] = object();
    root.append(el('section', { className: 'look', ariaLabel: 'Look' }, pick, words(), presets(), more));
    const advanced = el('details', { className: 'advanced', open: tuned() },
      el('summary', {}, 'Advanced', el('span', { textContent: 'every option, for fine-tuning' })));
    root.append(advanced);
    const section = (title, body, open) => advanced.append(el('details', { className: 'group', open }, el('summary', { textContent: title }), body));
    for (const [title, params] of GROUPS) {
      const body = el('div');
      for (const [key, kind, ...a] of params) {
        const v = kind === 'n' ? number(key, ...a) : kind === 'c' ? color(key, a[0]) : kind === 'd' ? direction(key)
          : kind === 'b' ? toggle(key) : kind === 's' ? choice(key, a[0]) : kind === 'puff' ? puff() : autoplay();
        views.push(v);
        body.append(v.row);
      }
      section(title, body, title !== 'Runtime');
    }
  }

  /** Controls ← state: values, the "set by you" dot, and which shape's options are shown. */
  const plainCall = () => resolveOptions({ ...(isText() ? { text: 'x' } : { image: 'x' }), shape: state.set.shape, material: state.material, feel: state.feel });
  function sync() {
    const o = effective(), sphere = o.shape === 'sphere', base = { ...plainCall(), ...TEXT_START, lineHeight: LINE_HEIGHT };
    const text = isText(), lines = text && String(state.set.text).includes('\n');
    for (const v of views) {
      v.show(o[v.key]);
      v.row.classList.toggle('set', v.key in state.set && !same(state.set[v.key], base[v.key]));
      v.row.hidden = (sphere && IMAGE_ONLY.has(v.key)) || (!sphere && SPHERE_ONLY.has(v.key))
        || (TEXT_KEYS.includes(v.key) && !text) || (v.key === 'lineHeight' && !lines) || (v.key === 'shape' && text);
    }
    code.textContent = printed();
  }

  /* ---- the printed call: image, presets, and only the keys that differ from what silkify would use anyway ---- */
  const code = document.getElementById('code');
  /** The options that differ from what silkify would use anyway (presets first), as source lines. */
  function optionLines() {
    const base = plainCall(), lines = [];
    if (state.material !== 'silk') lines.push(`material: '${state.material}'`);
    if (state.feel !== 'silk') lines.push(`feel: '${state.feel}'`);
    for (const [k, v] of Object.entries(state.set)) {
      if (TEXT_KEYS.includes(k)) continue;              // printed first, by textLines()
      if (v !== undefined && !same(v, base[k])) lines.push(`${k}: ${js(v)}`);
    }
    return lines;
  }
  /** Words: text, font and colour always (they are the object), the line height when it is set. */
  const textLines = () => TEXT_KEYS.filter((k) => state.set[k] !== undefined).map((k) => `${k}: ${js(state.set[k])}`);
  function printed() {
    const o = OBJECTS[state.obj];
    const lines = isText() ? textLines() : [`image: ${js(state.obj === 'custom' ? state.url || 'your-picture.png' : o.image)}`];
    if (o?.bump) lines.push(`bump: ${js(o.bump)}`);
    return `silkify(canvas, {\n  ${[...lines, ...optionLines()].join(',\n  ')},\n});`;
  }

  /* ============================================
   * Download HTML: this object and these options as one file that opens with a double-click (file:// is fine).
   * The picture is inside it as a data: URL; silk.js and three.js come from jsDelivr, pinned to the release, so
   * the file needs the network but no server. This is the one place the Lab uses the CDN way (one file, nowhere
   * to put src/), and the file and the button say so: a real page copies src/ (SKILL.md). Nothing leaves the
   * browser: the file is made here, and its markup is lab-export.js.
   * ============================================ */
  const SILK_CDN = 'https://cdn.jsdelivr.net/gh/RussGuo/silkify@v0.3.0/src/silk.js';
  // words are new on main, after v0.3.0: their page takes main until a release has them, then this tag line goes
  const SILK_CDN_WORDS = 'https://cdn.jsdelivr.net/gh/RussGuo/silkify@main/src/silk.js';
  const dataUrl = (blob) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
  const fetched = (url) => fetch(url, { mode: 'cors' }).then((r) => (r.ok ? r.blob() : Promise.reject(new Error(`HTTP ${r.status}`))));
  async function exportHtml() {
    const o = OBJECTS[state.obj], text = isText();
    const by = document.querySelector('#byline a');     // the byline build-integrations.mjs writes into this page
    return pageHtml({
      title: state.obj === 'custom' ? 'your picture' : text ? state.set.text.split('\n')[0].trim() : o.title,
      picture: text ? null : await dataUrl(state.obj === 'custom' ? custom || (await fetched(state.url)) : await fetched(o.image)),
      bump: o?.bump ? await dataUrl(await fetched(o.bump)) : null,
      lines: [...(text ? textLines() : ['image: PICTURE']), ...(o?.bump ? ['bump: BUMP'] : []), ...optionLines()],
      sheet: text ? stylesheetOf(state.set.font) : null,   // a Google Font: the same <link>, and the page waits for it
      silk: text ? SILK_CDN_WORDS : SILK_CDN, background: state.bg, credit: { name: by.textContent, href: by.href }, mark: state.obj === 'ink-drop',
    });
  }
  const fileName = () => (state.obj === 'custom' ? 'picture' : isText() ? 'words' : state.obj) + (state.material !== 'silk' ? `-${state.material}` : '');
  async function download(button) {
    try {
      const html = await exportHtml();
      const a = el('a', { href: URL.createObjectURL(new Blob([html], { type: 'text/html' })), download: `silkify-${fileName()}.html` });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      flash(button, 'Downloaded');
    } catch (e) {
      flash(button, `Could not read the picture (${e.message})`);
    }
  }

  /* ============================================
   * Pictures of your own: drop, paste, file or URL. Decoded in the page (createImageBitmap); nothing is uploaded.
   * ============================================ */
  function useBlob(blob) {
    custom = blob;                                      // silkify decodes it (an SVG is rasterised); a bad file shows as 'failed'
    state = { ...fresh('custom'), set: {}, obj: 'custom', url: null, material: state.material, feel: state.feel, bg: state.bg };
    commit({ remount: true });
  }
  function useUrl(raw) {
    const url = safeUrl(raw);                           // http(s), blob:, data:image/… or relative; nothing else
    if (!url) return;
    custom = null;
    state = { ...state, obj: 'custom', url, set: {} };
    commit({ remount: true });
  }
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('drag'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('drag');
    const f = [...e.dataTransfer.files].find((x) => x.type.startsWith('image/'));
    if (f) return useBlob(f);
    const u = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (/^https?:/.test(u)) useUrl(u.trim());
  });
  window.addEventListener('paste', (e) => {
    if (e.target.closest?.('input, select, textarea')) return;
    const item = [...e.clipboardData.items].find((x) => x.type.startsWith('image/'));
    if (item) return useBlob(item.getAsFile());
    const u = e.clipboardData.getData('text/plain');
    if (/^https?:/.test(u)) useUrl(u.trim());
  });

  /* ---- output buttons ---- */
  const flash = (b, text) => { const t = b.textContent; b.textContent = text; setTimeout(() => (b.textContent = t), 1200); };
  document.getElementById('copy').onclick = (e) => navigator.clipboard.writeText(printed()).then(() => flash(e.target, 'Copied'));
  document.getElementById('install').onclick = (e) => navigator.clipboard.writeText(e.currentTarget.dataset.install)
    .then(() => flash(e.target, 'Copied'), () => window.prompt('Copy this sentence and paste it into your agent:', e.target.dataset.install));
  document.getElementById('link').onclick = (e) => navigator.clipboard.writeText(location.href)
    .then(() => flash(e.target, isLocal() ? 'Copied, without your local picture' : 'Copied'));
  document.getElementById('download').onclick = (e) => download(e.target);
  document.getElementById('reset').onclick = () => {
    const obj = state.obj === 'custom' ? 'pomegranate' : state.obj;
    custom = null;
    state = { ...fresh(obj), bg: state.bg };
    commit({ remount: true });
  };

  /* ============================================
   * Stage actions: touch without a mouse (handle.ripple), and hold to compare with the defaults
   * ============================================ */
  // twelve light drops along a gentle curve; on words, each one moved onto the nearest ink (lab-text.js onInk)
  const CURVE = Array.from({ length: 12 }, (_, k) => [0.3 + 0.4 * (k / 11), 0.42 + 0.14 * (k / 11) + 0.05 * Math.sin((k / 11) * Math.PI * 2)]);
  const onObject = async (points) => (isText() && handle ? onInk(points, call(), handle.canvas) : points);
  const touch = (o) => onObject([[0.5, 0.5]]).then(([[x, y]]) => handle?.ripple(x, y, o));
  document.getElementById('touch').onclick = () => touch();
  let strokeTimer = 0;
  document.getElementById('stroke').onclick = async () => {
    const points = await onObject(CURVE);
    clearInterval(strokeTimer);
    let k = 0;                                          // 50 ms apart
    strokeTimer = setInterval(() => { handle?.ripple(...points[k], { hold: 60 }); if (++k >= points.length) clearInterval(strokeTimer); }, 50);
  };

  /* Record (lab-record.js): the Stroke and Touch buttons are its scripted motion */
  const rec = recorder({ stage, button: document.getElementById('record'), handle: () => handle, bg: () => state.bg, name: fileName,
    stroke: () => document.getElementById('stroke').click(), touch: () => touch({ hold: 300 }),
    playAnyway: () => document.getElementById('play').click() });
  let clip = null;                                      // the last clip made through window.__lab.record (shoot.mjs)

  /* Compare: the live options of silkify's defaults for this object (the gallery card's own options, or nothing for
   * your picture), then back. Scene options cannot change live and stay as they are, so the picture never jumps. */
  const SCENE = new Set([...REBUILD, 'image', 'bump', 'dpr', 'reducedMotion', 'threeUrl', 'poster', 'onHover', 'material', 'feel', 'interactive']);
  const liveOf = (o) => Object.fromEntries(Object.entries(o).filter(([k]) => !SCENE.has(k)));
  const defaults = () => resolveOptions({ image: 'x', ...(OBJECTS[state.obj]?.options || { shape: state.set.shape }) });
  let comparing = false;
  function compare(on) {
    if (on === comparing || !handle) return;
    comparing = on;
    stage.classList.toggle('compare', on);
    document.getElementById('compare').setAttribute('aria-pressed', String(on));
    handle.setTheme(liveOf(on ? defaults() : effective()));
  }
  const cmp = document.getElementById('compare');
  cmp.onpointerdown = (e) => { cmp.setPointerCapture(e.pointerId); compare(true); };
  cmp.onpointerup = cmp.onpointercancel = cmp.onlostpointercapture = () => compare(false);
  window.addEventListener('keydown', (e) => { if ((e.key === 'b' || e.key === 'B') && !e.repeat && !e.target.closest?.('input, select, textarea')) compare(true); });
  window.addEventListener('keyup', (e) => { if (e.key === 'b' || e.key === 'B') compare(false); });
  window.addEventListener('blur', () => compare(false));
  stage.addEventListener('dragstart', (e) => e.preventDefault());   // nothing on the stage is draggable

  /* ---- readouts: what the renderer chose, and frames it actually drew (handle.stats(), once a second) ---- */
  const read = document.getElementById('read');
  const DEBUG = qs.has('debug');                        // lab.html?debug: what the renderer chose and the frames it draws
  setInterval(async () => {
    if (!handle) return;
    const h = handle, s = await h.stats(), now = performance.now();
    if (h !== handle) return;
    const fps = lastFrames ? ((s.frames - lastFrames.frames) * 1000) / (now - lastFrames.at) : 0;
    lastFrames = { frames: s.frames, at: now };
    const i = h.info || {};
    read.textContent = h.mode === 'webgl' ? !DEBUG ? '' : `${h.tier} · ${h.thread} · sim ${i.sim}×${i.steps} · mesh ${i.mesh} · ${fps.toFixed(0)} fps · ${s.mode}`
      : h.reason ? `${h.mode}: ${h.reason}` : h.mode;
    read.classList.toggle('bad', h.mode === 'failed');
  }, 1000);

  /* ---- start ---- */
  build();
  sync();
  writeHash();
  window.__lab = {                                      // hooks for scripts/shoot.mjs
    get handle() { return handle; }, get state() { return state; }, readHash, compare, exportHtml, recorder: rec, get clip() { return clip; },
    record: (o) => rec.record(o, { save: false }).then((c) => { clip = c.blob; return { ...c, blob: undefined }; }),
    ready: () => new Promise((r) => setTimeout(r, 200)).then(() => mounting).then(() => handle.ready),
  };
  mount();
</script>
</body>
</html>
