<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silkify — a silk button</title>
<link rel="icon" href="data:,">
<!-- link previews (Open Graph, X / Twitter): docs/og.jpg is the README's hero, cropped to 1200 × 630 -->

<meta property="og:title" content="silkify — a silk button">
<meta property="og:description" content="A real button whose face is silk: it dents under a finger or the mouse, ripples when Enter or Space presses it, and stays an ordinary, accessible button.">

<!--
  The silk button: a silk object that is also a real <button>. The button does what a button does (it takes focus with
  Tab, Enter and Space press it, a screen reader reads its label, a click runs the action) and the silk is only its
  face, so nothing about the button depends on WebGL: in the static tier the face is the poster and the button works the
  same. The pattern, in four parts:
    1. the face inside the <button>, aria-hidden; the button's own text is its accessible name. The face is the poster,
       an <img>, from the first paint: the canvas is added over it only where silk can be live, and shown only once its
       first frame is up (onReady), so the face is never empty while the renderer loads. A lost WebGL context hides the
       canvas again (onFail) until it is back. The static tier (reduced motion, Save-Data, no WebGL2) keeps the picture
       alone and never loads three.js
    2. mouse and touch press the silk by themselves (silkify follows the pointer); onPress is there for feedback only
       (haptics: true, a sound), never for the action, which is the button's click
    3. the keyboard has no pointer: on Enter or Space, handle.ripple() at the centre, so the key is seen on the silk
    4. a focus ring of the page's own (:focus-visible), outside the canvas, so it is never drawn over
  scripts/verify-events.mjs presses it with a mouse, a finger and the keyboard (window.__button).
-->
<style>
  :root { --paper: #f3efe7; --ink: #1f1d1a; --muted: #6f695f; --face: #ebe6dc; --ring: #8a2f3c; color-scheme: light; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { margin: 0 0 6px; font: 400 40px/1.1 ui-serif, Georgia, serif; }
  .lede { margin: 0 0 32px; color: var(--muted); }
  .silk-button {
    display: grid; justify-items: center; gap: 4px; width: min(260px, 100%); padding: 10px 10px 16px;
    border: 0; border-radius: 22px; background: var(--face); color: var(--ink); font: inherit; font-size: 16px; font-weight: 500;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .silk-button .face { position: relative; width: 100%; aspect-ratio: 1; touch-action: manipulation; }
  .face img, .face canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: manipulation; }
  .face canvas { opacity: 0; transition: opacity 0.25s; }
  .face.live canvas { opacity: 1; }
  .face.live img { opacity: 0; transition: opacity 0.25s 0.05s; }
  .silk-button:focus { outline: none; }
  .silk-button:focus-visible { outline: 2px solid var(--ring); outline-offset: 4px; }
  .status { margin-top: 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>A silk button</h1>
  <p class="lede">A real button whose face is silk. Press it with the mouse, a finger, or Tab to it and press Enter or Space.</p>
  <button class="silk-button" id="buy" type="button">
    <span class="face" aria-hidden="true"><img src="posters/pomegranate.webp" srcset="posters/pomegranate.webp 1x, posters/pomegranate@2x.webp 2x" alt=""></span>
    <span>Add a pomegranate</span>
  </button>
  <p class="status"><output id="count" aria-live="polite">Nothing in the basket yet.</output></p>
</div>

<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js" } }
</script>
<script type="module">
  import { silkify } from '../src/silk.js';
  import { pickTier } from '../src/tier.js';

  const button = document.getElementById('buy');
  const state = window.__button = { clicks: 0, presses: [], handle: null };

  // 1–2: the face. Where silk can be live, a canvas goes over the poster and takes its place once its first frame is up
  // (onReady with mode 'webgl'); a lost context gives the face back to the poster (onFail) until it is restored. A press
  // with the mouse or a finger dents the silk on its own, and onPress only adds feedback
  if (pickTier().tier !== 'static') {
    const face = button.querySelector('.face');
    const canvas = document.createElement('canvas');
    face.append(canvas);
    const silk = state.handle = silkify(canvas, {
      image: 'images/pomegranate.webp', poster: 'posters/pomegranate.webp',
      haptics: true,                                       // one short tick on a phone that can
      onPress: (e) => state.presses.push(e.pointerType),
      onReady: (h) => face.classList.toggle('live', h.mode === 'webgl'),
      onFail: () => face.classList.remove('live'),
    });
    // 3: the keyboard presses the middle of the silk (Enter presses on keydown, Space on keyup: both are seen at once)
    button.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) silk.ripple(0.5, 0.5, { hold: 160 });
    });
  }

  // the action: the button's own click, whatever pressed it
  button.addEventListener('click', () => {
    state.clicks++;
    document.getElementById('count').textContent = `${state.clicks} pomegranate${state.clicks === 1 ? '' : 's'} in the basket.`;
  });
</script>
</body>
</html>
