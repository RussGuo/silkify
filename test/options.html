<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silkify options</title>
<link rel="icon" href="data:,">
<!--
  options.html — options the use-case pages asked for (examples/demos/), run by scripts/shoot.mjs (verify-options.mjs).
  It checks itself; verify-options.mjs adds what only a screenshot can see (a live canvas cannot be read back).
    corner0   matte: 'rect' with corner: 0 is a square: the dome exists and its corners are inside (every pixel used to
              sit exactly on the threshold, so nothing was inside and the mount failed); corner 0.06 still rounds them
    cover     fit: 'cover' in the static tier: the picture covers the whole canvas, wide and tall, without a remount;
              a fit that is neither a number above 0 nor 'cover' throws; element mode with 'cover' throws
    poster    a poster that is a canvas, a function (called with the canvas's device-pixel size, again on a resize), an
              async function, and one that returns nothing usable (mode 'failed', a reason, one warning)
    breeze    breezeIdle: the breeze stops (mode 'tail') once nobody has touched the object for that long, and wake()
              starts it again; without breezeIdle it never stops; scrolled out of view, no frames at all
    ink       words are centred on their ink, not on the font's line box: a 'y' (a descender), a 'g' and an em dash in
              the static tier, whose 2D canvas can be read (the live ones: verify-options.mjs)
  The live canvases for verify-options.mjs: #cover-wide and #contain-wide (a square opaque picture in a 3:1 canvas), and
  #sphere, the moon, which verify-options.mjs presses hard near its limb and poles (the outline must not move), and
  #ink-live, a 'y', whose ink must be centred.
  window.__options = { out, problems, handles } at the end. Low tier: no idle sweep.
-->
<style>
  body { margin: 0; padding: 12px; font: 12px ui-monospace, Menlo, monospace; background: rgb(240, 240, 240); }
  .row { display: flex; gap: 16px; align-items: start; margin-bottom: 16px; }
  canvas { display: block; }
  .wide { width: 300px; height: 100px; }
  .sq { width: 120px; height: 120px; }
  .sphere { width: 240px; height: 240px; }
  #far { margin-top: 3000px; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js" } }
</script>
</head>
<body>
<div class="row"><canvas id="cover-wide" class="wide"></canvas><canvas id="contain-wide" class="wide"></canvas><canvas id="corner0" class="sq"></canvas></div>
<div class="row"><canvas id="static-cover" class="wide"></canvas><canvas id="p-canvas" class="sq"></canvas><canvas id="p-fn" class="sq"></canvas><canvas id="p-async" class="sq"></canvas><canvas id="p-bad" class="sq"></canvas></div>
<div class="row"><canvas id="sphere" class="sphere"></canvas><canvas id="breeze-idle" class="sq"></canvas><canvas id="breeze-on" class="sq"></canvas></div>
<div class="row"><canvas id="ink-live" class="sq"></canvas><canvas id="ink-y" class="sq"></canvas><canvas id="ink-g" class="sq"></canvas><canvas id="ink-dash" class="sq"></canvas></div>
<div id="far"><canvas id="breeze-far" class="sq"></canvas></div>
<script type="module">
  import { silkify } from '../src/silk.js';
  import { buildShape } from '../src/shape.js';
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const $ = (id) => document.getElementById(id);
  const out = {}, problems = [], handles = {};
  const warned = [];
  const warn = console.warn;
  console.warn = (...a) => { warned.push(a.join(' ')); };   // the one expected warning is counted here, not reported
  /** A plain picture: one opaque colour, w × h. */
  const solid = (w, h, color) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = color; g.fillRect(0, 0, w, h); return c; };
  /** The colour at (fx, fy) of a 2D canvas (0–1), as [r, g, b, a]. */
  const at = (canvas, fx, fy) => [...canvas.getContext('2d').getImageData(Math.min(canvas.width - 1, Math.floor(fx * canvas.width)), Math.min(canvas.height - 1, Math.floor(fy * canvas.height)), 1, 1).data];
  const near = (p, q) => p.every((v, i) => Math.abs(v - q[i]) < 12);
  const corners = [[0.01, 0.01], [0.99, 0.01], [0.01, 0.99], [0.99, 0.99]];

  // ---- corner: 0 is a square ----
  {
    const pic = solid(200, 120, '#7a2a1c');
    const s0 = buildShape(pic, { matte: 'rect', corner: 0 }), s6 = buildShape(pic, { matte: 'rect', corner: 0.06 });
    // the silhouette is 2 / side of the domain wide (centred), its height × aspect: a point just inside its corner
    const cornerUv = (s) => [0.5 - 0.98 / s.side, 0.5 - (0.98 * s.aspect) / s.side];
    out.corner0 = { shape: !!s0, cornerInside: s0 ? s0.inside(...cornerUv(s0)) : null, rounded: s6 ? !s6.inside(...cornerUv(s6)) : null };
    if (!s0) problems.push('corner0: buildShape() with corner 0 found nothing inside');
    else if (!out.corner0.cornerInside) problems.push('corner0: the corner of a corner-0 rectangle is not inside');
    if (!out.corner0.rounded) problems.push('corner0: corner 0.06 no longer rounds the corner');
    const h = handles.corner0 = silkify($('corner0'), { image: pic, matte: 'rect', corner: 0, fit: 1, tier: 'low' });
    await h.ready;
    out.corner0.mode = h.mode;
    if (h.mode !== 'webgl') problems.push(`corner0: silkify() with corner 0 is ${h.mode} (${h.reason})`);
  }

  // ---- fit: 'cover' ----
  {
    const pic = solid(160, 160, '#2f4f6b');
    handles.coverWide = silkify($('cover-wide'), { image: pic, matte: 'rect', corner: 0, fit: 'cover', puff: 0.05, tier: 'low', fillLight: false });
    handles.containWide = silkify($('contain-wide'), { image: pic, matte: 'rect', corner: 0, fit: 1, puff: 0.05, tier: 'low', fillLight: false });
    await Promise.all([handles.coverWide.ready, handles.containWide.ready]);
    out.cover = { live: handles.coverWide.mode, contain: handles.containWide.mode };
    if (handles.coverWide.mode !== 'webgl') problems.push(`cover: fit 'cover' is ${handles.coverWide.mode} (${handles.coverWide.reason})`);
    // the static tier draws the picture by the same rule: covered, wide and then tall
    const st = silkify($('static-cover'), { image: pic, matte: 'rect', corner: 0, fit: 'cover', tier: 'static' });
    await st.ready;
    await sleep(50);
    const wide = corners.map(([x, y]) => near(at(st.canvas, x, y), [0x2f, 0x4f, 0x6b, 255]));
    st.canvas.style.cssText = 'width: 100px; height: 300px';
    await sleep(200);   // the ResizeObserver repaints it
    const tall = corners.map(([x, y]) => near(at(st.canvas, x, y), [0x2f, 0x4f, 0x6b, 255]));
    out.cover.static = { wide, tall };
    if (![...wide, ...tall].every(Boolean)) problems.push(`cover: the static tier leaves a corner uncovered (wide ${wide}, tall ${tall})`);
    st.dispose();
    const throws = (o) => { try { silkify(document.createElement('canvas'), o); return null; } catch (e) { return e instanceof TypeError ? e.message : `not a TypeError: ${e}`; } };
    out.cover.errors = { word: throws({ image: pic, fit: 'contain' }), zero: throws({ image: pic, fit: 0 }), element: throws({ element: document.body, fit: 'cover' }) };
    for (const [k, v] of Object.entries(out.cover.errors)) if (!v || v.startsWith('not')) problems.push(`cover: fit ${k} should throw a TypeError (${v})`);
  }

  // ---- poster: a canvas, a function, an async function, a function that returns nothing ----
  {
    const green = [0x3c, 0x8a, 0x4a, 255];
    const calls = [];
    const fn = ({ width, height }) => { calls.push([width, height]); return solid(width, height, '#3c8a4a'); };
    const hs = {
      canvas: silkify($('p-canvas'), { image: solid(64, 64, '#000'), poster: solid(50, 50, '#3c8a4a'), tier: 'static' }),
      fn: silkify($('p-fn'), { image: solid(64, 64, '#000'), poster: fn, tier: 'static' }),
      async: silkify($('p-async'), { image: solid(64, 64, '#000'), poster: async ({ width }) => { await sleep(30); return solid(width, width, '#3c8a4a'); }, tier: 'static' }),
    };
    await Promise.all(Object.values(hs).map((h) => h.ready));
    out.poster = Object.fromEntries(Object.entries(hs).map(([k, h]) => [k, `${h.mode} ${near(at(h.canvas, 0.5, 0.5), green) ? 'poster' : 'NOT THE POSTER'}`]));
    for (const [k, v] of Object.entries(out.poster)) if (v !== 'static poster') problems.push(`poster ${k}: ${v}`);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (!calls.length || calls[0][0] !== Math.round(120 * dpr)) problems.push(`poster fn: called with ${JSON.stringify(calls[0])}, not the canvas's device-pixel size`);
    hs.fn.canvas.style.width = '90px';
    await sleep(200);
    out.poster.calls = calls.length;
    if (calls.length < 2 || calls.at(-1)[0] !== Math.round(90 * dpr)) problems.push(`poster fn: not called again at the new size (${JSON.stringify(calls)})`);
    const bad = silkify($('p-bad'), { image: solid(64, 64, '#000'), poster: () => null, tier: 'static' });
    await bad.ready;
    out.poster.bad = `${bad.mode}: ${bad.reason}`;
    if (bad.mode !== 'failed' || !/poster/.test(bad.reason) || warned.filter((w) => /poster/.test(w)).length !== 1) problems.push(`poster bad: ${out.poster.bad}, warnings ${JSON.stringify(warned)}`);
    for (const h of Object.values(hs)) h.dispose();
  }

  // ---- breeze: breezeIdle stops it, a touch or wake() starts it again; out of view nothing is drawn ----
  {
    const PEAR = '../examples/images/pomegranate.webp';
    const idle = handles.breezeIdle = silkify($('breeze-idle'), { image: PEAR, breeze: 0.5, breezeIdle: 1200, tier: 'low' });
    const on = handles.breezeOn = silkify($('breeze-on'), { image: PEAR, breeze: 0.5, tier: 'low' });
    const far = handles.breezeFar = silkify($('breeze-far'), { image: PEAR, breeze: 0.5, tier: 'low' });
    await Promise.all([idle.ready, on.ready, far.ready]);
    await sleep(300);
    const a = (await idle.stats()).mode;
    await sleep(1500);
    const b = await idle.stats(), always = (await on.stats()).mode;
    await sleep(500);
    const c = await idle.stats();
    idle.wake();
    await sleep(300);
    const d = (await idle.stats()).mode;
    const f0 = (await far.stats()).frames;
    await sleep(1000);
    const f1 = (await far.stats()).frames;
    out.breeze = { start: a, idle: b.mode, fps: Math.round((c.frames - b.frames) * 2), woken: d, always, farFrames: f1 - f0 };
    if (a !== 'breeze' || b.mode === 'breeze' || d !== 'breeze') problems.push(`breeze: with breezeIdle ${a} → ${b.mode} after 1.8 s → ${d} after wake()`);
    if (b.mode === 'tail' && out.breeze.fps > 14) problems.push(`breeze: still ${out.breeze.fps} fps after it stopped`);
    if (always !== 'breeze') problems.push(`breeze: without breezeIdle it stopped (${always})`);
    if (f1 !== f0) problems.push(`breeze: ${f1 - f0} frames in 1 s out of view`);
    for (const h of [idle, on, far]) h.dispose();
  }

  // ---- words: centred on their ink ----
  {
    const word = { font: '800 160px Georgia, serif', color: '#2a2a2a' };
    const hs = { y: silkify($('ink-y'), { ...word, text: 'y', tier: 'static' }), g: silkify($('ink-g'), { ...word, text: 'g', tier: 'static' }), dash: silkify($('ink-dash'), { ...word, text: '—', tier: 'static' }) };
    handles.inkLive = silkify($('ink-live'), { ...word, text: 'y', tier: 'low', fillLight: false });
    await Promise.all([...Object.values(hs), handles.inkLive].map((h) => h.ready));
    out.ink = {};
    for (const [k, h] of Object.entries(hs)) {
      const c = h.canvas, a = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
      let x0 = c.width, x1 = -1, y0 = c.height, y1 = -1;
      for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (a[(y * c.width + x) * 4 + 3] > 128) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      const dx = (x0 + x1 + 1) / 2 / c.width - 0.5, dy = (y0 + y1 + 1) / 2 / c.height - 0.5;
      out.ink[k] = `${(dx * 100).toFixed(1)} %, ${(dy * 100).toFixed(1)} %`;
      if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) problems.push(`ink ${k}: its ink is ${out.ink[k]} off the centre`);
      h.dispose();
    }
  }

  // ---- a sphere at rest, for verify-options.mjs to press ----
  handles.sphere = silkify($('sphere'), { image: '../examples/images/moon.webp', shape: 'sphere', tier: 'low', fillLight: false, spin: false });
  await handles.sphere.ready;
  out.sphere = handles.sphere.mode;
  if (handles.sphere.mode !== 'webgl') problems.push(`sphere: ${handles.sphere.mode} (${handles.sphere.reason})`);

  console.warn = warn;
  window.__options = { out, problems, handles };
</script>
</body>
</html>
